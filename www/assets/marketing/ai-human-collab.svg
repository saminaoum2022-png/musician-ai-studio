<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" fill="none">
  <defs>
    <linearGradient id="aiOrbG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#36e7c0"/>
      <stop offset=".45" stop-color="#3f73f0"/>
      <stop offset="1" stop-color="#6a23da"/>
    </linearGradient>
    <radialGradient id="aiOrbHi" cx=".34" cy=".28" r=".72">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".5"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="panelGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5b3cff" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#3f73f0" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#05070d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="waveG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset=".35" stop-color="#2dd4bf" stop-opacity=".85"/>
      <stop offset=".65" stop-color="#7c5cff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="#05070d"/>
  <rect width="1200" height="900" fill="url(#panelGlow)"/>

  <!-- connection arc -->
  <path d="M330 455 C470 320, 730 320, 870 455" stroke="url(#waveG)" stroke-width="3" stroke-linecap="round" opacity=".75"/>
  <path d="M350 470 C500 350, 700 350, 850 470" stroke="rgba(45,212,191,.18)" stroke-width="1.5" stroke-dasharray="6 10"/>

  <!-- waveform bridge -->
  <g opacity=".9" filter="url(#softGlow)">
    <path d="M420 452 h18 v-34 h18 v68 h18 v-22 h18 v44 h18 v-56 h18 v34 h18 v-12 h18 v28" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M678 452 h18 v-48 h18 v28 h18 v-18 h18 v52 h18 v-38 h18 v22 h18 v-44 h18 v36" stroke="#9b87ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- human vocalist -->
  <g transform="translate(210 470)">
    <circle cx="0" cy="-118" r="52" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.14)" stroke-width="2"/>
    <circle cx="0" cy="-118" r="38" fill="rgba(255,255,255,.04)"/>
    <path d="M-34 -76 C-34 -20, 34 -20, 34 -76" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="2"/>
    <path d="M-78 12 C-56 88, 56 88, 78 12" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.16)" stroke-width="2"/>
    <rect x="-14" y="-34" width="28" height="18" rx="9" fill="rgba(45,212,191,.18)" stroke="rgba(45,212,191,.45)" stroke-width="1.5"/>
    <g transform="translate(68 -20)">
      <rect x="0" y="28" width="8" height="72" rx="4" fill="rgba(255,255,255,.12)"/>
      <ellipse cx="18" cy="28" rx="22" ry="30" fill="rgba(255,255,255,.05)" stroke="rgba(255,210,130,.55)" stroke-width="2"/>
      <path d="M40 28 C58 34, 58 58, 40 64" stroke="rgba(255,210,130,.55)" stroke-width="2" fill="none"/>
      <circle cx="40" cy="64" r="5" fill="rgba(255,210,130,.75)"/>
    </g>
    <text x="0" y="118" text-anchor="middle" fill="rgba(255,255,255,.42)" font-family="system-ui,sans-serif" font-size="15" font-weight="600" letter-spacing=".08em">YOU</text>
  </g>

  <!-- AI studio -->
  <g transform="translate(990 470)">
    <circle cx="0" cy="-118" r="58" fill="rgba(106,35,218,.12)" stroke="rgba(124,92,255,.35)" stroke-width="2"/>
    <circle cx="0" cy="-118" r="42" fill="url(#aiOrbG)" filter="url(#softGlow)"/>
    <circle cx="0" cy="-118" r="42" fill="url(#aiOrbHi)"/>
    <path d="M-42 -118 A42 42 0 0 1 0 -160" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round" fill="none" opacity=".85"/>
    <path d="M42 -118 A42 42 0 0 0 0 -76" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round" fill="none" opacity=".85"/>
    <path d="M-52 8 C-28 72, 28 72, 52 8" fill="rgba(124,92,255,.08)" stroke="rgba(124,92,255,.28)" stroke-width="2"/>
    <g transform="translate(-54 -8)">
      <rect x="0" y="0" width="108" height="62" rx="14" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.1)" stroke-width="1.5"/>
      <path d="M16 44 h12 v-24 h10 v16 h10 v-20 h10 v28 h10 v-14 h10 v22 h12 v-30" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round" fill="none" opacity=".85"/>
    </g>
    <text x="0" y="118" text-anchor="middle" fill="rgba(255,255,255,.42)" font-family="system-ui,sans-serif" font-size="15" font-weight="600" letter-spacing=".08em">AI</text>
  </g>

  <!-- remix / collab chips -->
  <g font-family="system-ui,sans-serif" font-size="13" font-weight="600">
    <rect x="468" y="168" width="118" height="34" rx="17" fill="rgba(45,212,191,.1)" stroke="rgba(45,212,191,.28)" stroke-width="1"/>
    <text x="527" y="190" text-anchor="middle" fill="rgba(45,212,191,.92)">Pro vocals</text>
    <rect x="614" y="168" width="118" height="34" rx="17" fill="rgba(124,92,255,.1)" stroke="rgba(124,92,255,.28)" stroke-width="1"/>
    <text x="673" y="190" text-anchor="middle" fill="rgba(167,139,250,.95)">Remix</text>
    <rect x="540" y="688" width="120" height="34" rx="17" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.12)" stroke-width="1"/>
    <text x="600" y="710" text-anchor="middle" fill="rgba(255,255,255,.55)">Together</text>
  </g>
</svg>
