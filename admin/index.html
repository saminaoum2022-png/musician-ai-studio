<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Nabad AI Admin</title>
    <meta name="theme-color" content="#05070d" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="stylesheet" href="/admin/styles.css" />
    <script>
      (function () {
        try {
          var host = window.location.hostname || "";
          var search = window.location.search || "";
          var hash = window.location.hash || "";
          if (
            host === "nabadai.com" &&
            (search.indexOf("code=") !== -1 ||
              search.indexOf("error=") !== -1 ||
              hash.indexOf("access_token=") !== -1)
          ) {
            window.location.replace("https://www.nabadai.com/admin/" + search + hash);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>
      <p style="padding:24px;color:#eef4ff;font-family:system-ui,sans-serif">
        Enable JavaScript to use Nabad AI Admin.
      </p>
    </noscript>
    <div id="loginScreen" class="loginScreen">
      <div class="loginCard">
        <div class="loginBrand">
          <div class="loginLogo" aria-hidden="true">N</div>
          <h1>Nabad AI Admin</h1>
          <p>Sign in with the same account you use in the app</p>
        </div>
        <div class="loginActions">
          <button type="button" class="btnGoogle" id="btnLoginGoogle">
            <span class="btnGoogleIcon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" focusable="false">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
              </svg>
            </span>
            <span>Continue with Google</span>
          </button>
          <div class="loginDivider" aria-hidden="true"><span>or email &amp; password</span></div>
        </div>
        <form id="loginForm" class="loginForm">
          <label class="field">
            <span>Email</span>
            <input id="loginEmail" type="email" autocomplete="username" required />
          </label>
          <label class="field">
            <span>Password</span>
            <input id="loginPassword" type="password" autocomplete="current-password" required />
          </label>
          <button type="submit" class="btnPrimary" id="btnLogin">Sign in</button>
          <p id="loginError" class="loginError" hidden></p>
        </form>
      </div>
    </div>

    <div id="resetScreen" class="loginScreen" hidden>
      <div class="loginCard">
        <div class="loginBrand">
          <div class="loginLogo" aria-hidden="true">N</div>
          <h1>Set admin password</h1>
          <p>Choose a password for your Google account so you can sign in to admin.</p>
        </div>
        <form id="resetForm" class="loginForm">
          <label class="field">
            <span>New password</span>
            <input id="resetPassword" type="password" autocomplete="new-password" minlength="8" required />
          </label>
          <label class="field">
            <span>Confirm password</span>
            <input id="resetPasswordConfirm" type="password" autocomplete="new-password" minlength="8" required />
          </label>
          <button type="submit" class="btnPrimary" id="btnResetPassword">Save password</button>
          <p id="resetError" class="loginError" hidden></p>
        </form>
      </div>
    </div>

    <div id="appShell" class="appShell" hidden>
      <aside class="sidebar">
        <div class="sidebarBrand">
          <div class="sidebarLogo" aria-hidden="true">N</div>
          <div>
            <div class="sidebarTitle">Nabad AI</div>
            <div class="sidebarSub">Admin</div>
          </div>
        </div>
        <nav class="sidebarNav" aria-label="Admin sections">
          <button type="button" class="navItem isActive" data-view="overview">Overview</button>
          <button type="button" class="navItem" data-view="suno">Suno bucket</button>
          <button type="button" class="navItem" data-view="users">Users</button>
          <button type="button" class="navItem" data-view="credits">Credits</button>
          <button type="button" class="navItem" data-view="generations">Generations</button>
          <button type="button" class="navItem" data-view="subscriptions">Subscriptions</button>
        </nav>
        <div class="sidebarFoot">
          <div id="adminUserEmail" class="adminUserEmail">—</div>
          <button type="button" class="btnGhost" id="btnSignOut">Sign out</button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <h2 id="pageTitle" class="pageTitle">Overview</h2>
            <p id="pageSub" class="pageSub">Platform health at a glance</p>
          </div>
          <button type="button" class="btnGhost" id="btnRefresh">Refresh</button>
        </header>

        <div id="viewOverview" class="viewPanel" data-panel="overview"></div>
        <div id="viewSuno" class="viewPanel" data-panel="suno" hidden></div>
        <div id="viewUsers" class="viewPanel" data-panel="users" hidden></div>
        <div id="viewCredits" class="viewPanel" data-panel="credits" hidden></div>
        <div id="viewGenerations" class="viewPanel" data-panel="generations" hidden></div>
        <div id="viewSubscriptions" class="viewPanel" data-panel="subscriptions" hidden></div>

        <div id="globalError" class="globalError" hidden></div>
      </main>
    </div>

    <script type="module" src="/admin/app.js?v=20260709-supabase"></script>
  </body>
</html>
